name: Update GitHub Profile Stats

on:
  schedule:
    # 每天 UTC 02:00（北京时间 10:00）自动刷新一次
    - cron: "0 2 * * *"
  workflow_dispatch: {}   # 也可在 Actions 页手动触发

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate stats.svg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: zhengjy01
        run: bash .github/scripts/generate-stats.sh

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats.svg
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update profile stats (auto-generate)"
            git push
          fi
